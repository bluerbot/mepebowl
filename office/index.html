<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mepe Bowl — Office</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e1a;
      color: #f4f0e6;
      font-family: sans-serif;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 480px);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0a0e1a;
    }

    #office-view {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    #hello-sign {
      padding: 24px 36px;
      border: 1px solid rgba(214, 177, 94, 0.65);
      border-radius: 6px;
      background: rgba(10, 14, 26, 0.88);
      text-align: center;
    }

    #hello-sign h1 {
      margin: 0;
      color: #f4dfad;
      font-size: 24px;
      letter-spacing: 0.16em;
    }
  </style>
</head>

<body>
  <main id="stage">
    <section id="office-view" aria-label="Office">
      <div id="hello-sign">
        <h1>HELLO</h1>
      </div>
    </section>
  </main>
</body>
</html>
