<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mepe Bowl — Office</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e1a;
      color: #f4f0e6;
      font-family: sans-serif;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 480px);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0a0e1a;
    }

    #office-view {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    #hello-sign {
      padding: 24px 36px;
      border: 1px solid rgba(214, 177, 94, 0.65);
      border-radius: 6px;
      background: rgba(10, 14, 26, 0.88);
      text-align: center;
    }

    #hello-sign h1 {
      margin: 0;
      color: #f4dfad;
      font-size: 24px;
      letter-spacing: 0.16em;
    }

    #office-monitor {
      display: inline-block;
      margin-top: 18px;
      color: #f4dfad;
      font-size: 13px;
      letter-spacing: 1px;
    }

    #office-back {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 22px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #191919;
      color: #bbb;
      font-size: 11px;
      letter-spacing: 1px;
      text-decoration: none;
    }

    #office-back:hover {
      color: white;
    }

  </style>
</head>


<script type="module">
  const response = await fetch('./encounter__hello.json');

  if (!response.ok) {
    throw new Error('Encounter context unavailable');
  }

  const encounter = await response.json();

  document.getElementById('greeting').textContent =
    encounter.context.greeting;

  console.log('Encounter:', encounter);

  const accessResponse = await fetch('./encounter__access_monitor.json');
  if (accessResponse.ok) {
    const access = await accessResponse.json();
    const path = access.context.coupling.pathing.access;
    if (path.status === 'authenticated-health-verified' && path.destination) {
      const link = document.getElementById('office-monitor');
      link.href = path.destination;
      link.hidden = false;
      link.style.removeProperty("display");
    }
  }
</script>


<body>
  <main id="stage">
    <section id="office-view" aria-label="Office">
      <div id="hello-sign">
        <h1 id="greeting"></h1>
        <a id="office-monitor" hidden style="display:none">MONITOR</a>
      </div>
    </section>

    <a id="office-back" href="../r15/">BACK</a>

  </main>
</body>
</html>
