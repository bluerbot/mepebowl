<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mepe Bowl — R1.5</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e1a;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 480px);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0a0e1a;
    }


    #encounter {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      height: 33%;
      overflow: hidden;

      background-image: url('./assets/lanebg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
         "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="stage">
  <div id="encounter"></div>
</main>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
