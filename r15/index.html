
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mepe Bowl — Front Door</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0a0e1a;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    #stage {
      position: relative;
      width: min(100vw, 480px);
      min-height: 100dvh;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 16px 24px;
    }

    .menu-container {
      width: min(400px, 100%);
      padding: clamp(24px, 8vw, 40px);
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      text-align: center;
    }

    .menu-title {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .menu-tagline {
      margin: 0 0 30px;
      color: #00cfe8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .menu-group {
      margin-bottom: 25px;
      text-align: left;
    }

    .menu-label {
      display: block;
      margin-bottom: 10px;
      color: #aaa;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .option-btn {
      width: 100%;
      padding: 12px;
      background: #fff;
      border: 1px solid #fff;
      border-radius: 4px;
      color: #000;
      font: 600 16px 'Inter', sans-serif;
    }

    .range-slider {
      width: 100%;
      margin-bottom: 5px;
    }

    .range-val {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
    }

    .start-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      background: #fff;
      border: 1px solid #fff;
      border-radius: 4px;
      color: #000;
      font: 800 18px 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .start-btn:hover { background: #ddd; }

    #lane22-sign {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(350px, 90%);
      height: 105px;
      cursor: pointer;
    }

    #lane22-sign canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

  </style>
</head>
<body>
  <main id="stage">

    <a id="lane22-sign"
       href="./lane22/"
       aria-label="Enter Lane 22 directly"></a>


    <section class="menu-container">
      <h1 class="menu-title">MEPE BOWL</h1>
      <p class="menu-tagline">THE $NIGHT SHIFT STARTS HERE.</p>

      <div class="menu-group">
        <span class="menu-label">Players</span>
        <button class="option-btn" disabled>
          IF YOU KNOW, YOU'RE AT THE RIGHT PLACE.
        </button>
      </div>

      <div class="menu-group">
        <label class="menu-label" for="rounds-slider">
          Rounds (Frames)
        </label>
        <input type="range" id="rounds-slider"
               class="range-slider" min="1" max="10" value="10">
        <div class="range-val" id="rounds-val">10</div>
      </div>

      <button class="start-btn" id="play-now">PLAY NOW</button>
      <button class="credits-link" id="show-credits">CREDITS</button>
    </section>
  </main>

  <script>
    const slider = document.querySelector('#rounds-slider');
    slider.addEventListener('input', () => {
      document.querySelector('#rounds-val').textContent = slider.value;
    });

    document.querySelector('#play-now').addEventListener('click', () => {
      window.location.href = './markers/';
    });

  </script>


  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./frontdoor-sign.mjs"></script>
  <script type="module" src="./credits.mjs"></script>

</body>
</html>
