<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mepe Bowl — R1.5</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e1a;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 480px);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0a0e1a;
    }

    #bowl-now {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #d6b15e;
      border-radius: 4px;
      background: #171d2b;
      color: #f4dfad;
      font: 600 14px/1 sans-serif;
      letter-spacing: 0.12em;
      text-decoration: none;
      white-space: nowrap;
    }

    #bowl-now:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    #encounter {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      height: 33%;
      overflow: hidden;
      background-image: url('./assets/lanebg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="stage">
    <a id="bowl-now" href="./lane22/index.html">BOWL NOW</a>
    <div id="encounter"></div>
  </main>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
