<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mepe Bowl — Lane 22</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e1a;
      color: #f4f0e6;
      font-family: sans-serif;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 480px);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0a0e1a;
    }

    #lane-view {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(10, 14, 26, 0.35), rgba(10, 14, 26, 0.88)),
        url('../assets/lanebg.png') center / cover no-repeat;
    }

    #lane-card {
      width: 100%;
      padding: 32px 20px;
      border: 1px solid rgba(214, 177, 94, 0.65);
      border-radius: 6px;
      background: rgba(10, 14, 26, 0.88);
      text-align: center;
    }

    #lane-card h1 {
      margin: 0;
      color: #f4dfad;
      font-size: 30px;
      letter-spacing: 0.16em;
    }

    #lane-card p {
      margin: 18px 0 0;
      color: #d4d8e1;
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 0.08em;
    }

    #lane-card .status {
      margin-top: 28px;
      color: #9da7b9;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    #back-to-markers {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 18px;
      border: 1px solid #d6b15e;
      border-radius: 4px;
      color: #f4dfad;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-decoration: none;
    }

    #back-to-markers:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main id="stage">
    <section id="lane-view" aria-labelledby="lane-title">
      <div id="lane-card">
        <h1 id="lane-title">LANE 22</h1>
        <p>APPROACH &nbsp;·&nbsp; DOT LINE &nbsp;·&nbsp; PIN DECK</p>
        <p class="status">MOCK ENTRY — LANE EXPERIENCE NOT CONNECTED</p>
        <a id="back-to-markers" href="../index.html">BACK TO MARKERS</a>
      </div>
    </section>
  </main>
</body>
</html>
