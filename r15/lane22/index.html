
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mepe Bowl — Lane 22</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e1a;
    }

    #stage {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 480px);
      height: 100dvh;
      overflow: hidden;
    }

    #bowling-encounter {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <main id="stage">
    <iframe
      id="bowling-encounter"
      title="Lane 22 bowling encounter"
      src="../../game/html/init.html?encounter=lane22"
      allow="fullscreen"
    ></iframe>
  </main>
</body>
</html>
